[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m1-understanding"
version = "0.1.0a1"
description = "Experimental modular event understanding with explicit feature and model interfaces"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "XRedMzK"}]
dependencies = ["torch==2.13.0", "numpy==2.5.2", "safetensors==0.8.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
provider = ["transformers==5.15.0", "tokenizers==0.22.2", "huggingface-hub==1.27.0", "accelerate==1.14.0"]

[project.urls]
Repository = "https://github.com/XRedMzK/M1-Event-Understanding"
Issues = "https://github.com/XRedMzK/M1-Event-Understanding/issues"
Documentation = "https://github.com/XRedMzK/M1-Event-Understanding/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

